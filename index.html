<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tecnostock</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="header-container">
        <a class="logo" href="#" aria-label="Tecnostock store, inicio"
          >Tecnostock<span>store.</span></a
        >
        <button
          id="cart-toggle-btn"
          class="cart-toggle-btn"
          type="button"
          aria-label="Abrir carrito de compras"
          aria-expanded="false">
          <span>Mi carrito</span>
          <span id="cart-count" class="cart-badge" aria-live="polite">0</span>
        </button>
      </div>
    </header>
    <div class="container-main">
      <section
        class="products-filter"
        aria-label="Filtros y ordenamiento de productos">
        <div class="search-box">
          <label for="search-input" class="visually-hidden"
            >Buscar y ordenar productos</label
          >
          <input
            type="search"
            id="search-input"
            placeholder="¿Qué estás buscando hoy?"
            autocomplete="off" />
        </div>
        <div class="filter-box">
          <label for="category-filter" class="visually-hidden"
            >Filtrar por categoria</label
          >
          <select id="category-filter">
            <option value="all">Todas las categorias</option>
            <option value="Perifericos">Perifericos</option>
            <option value="Articulos para tu setup">Articulos para tu setup</option>
            <option value="Equipos">Equipos</option>
          </select>

          <label for="sort-filter" class="visually-hidden"
            >Ordenar productos</label
          >
          <select id="sort-filter">
            <option value="default">Ordenar por...</option>
            <option value="price-asc">Precio: Menor a Mayor</option>
            <option value="price-desc">Precio: Mayor a Menor</option>
            <option value="name-asc">Nombre: A - Z</option>
            <option value="name-desc">Nombre: Z - A</option>
          </select>

          <label class="available-label">
            <input type="checkbox" id="available-filter" />
            Solo disponibles
          </label>
          <button
            id="clear-filters-btn"
            class="clear-filters-btn"
            type="button">
            Limpiar filtros
          </button>
        </div>
      </section>

      <main>
        <section aria-label="Catálogo de productos">
          <div class="catalog-heading">
            <div>
              <h2>Nuestros productos</h2>
            </div>
            <span class="catalog-note"
              >Poder tecnologico al alcance de tu mano</span
            >
          </div>
          <product-list id="products-grid"></product-list>
        </section>
      </main>

      <aside
        id="cart-modal"
        class="cart-drawer"
        role="dialog"
        aria-modal="true"
        aria-hidden="true"
        aria-label="Carrito de compras">
        <div class="cart-overlay" data-close="cart"></div>

        <div class="cart-content">
          <header class="cart-header">
            <h2>Tu Carrito</h2>
            <button
              id="cart-close-btn"
              class="close-btn"
              type="button"
              aria-label="Cerrar carrito">
              &times;
            </button>
          </header>

          <shopping-cart
            id="cart-items"
            class="cart-items-list"></shopping-cart>
          <footer class="cart-footer">
            <button
              id="checkout-btn"
              class="checkout-btn"
              type="button"
              disabled>
              Finalizar Compra
            </button>
            <button
              id="clear-cart-btn"
              class="clear-cart-btn"
              type="button"
              disabled>
              Vaciar carrito
            </button>
          </footer>
        </div>
      </aside>
    </div>
    <dialog
      id="checkout-modal"
      class="checkout-modal"
      aria-labelledby="checkout-title">
      <button
        type="button"
        class="checkout-close close-btn"
        aria-label="Cerrar resumen del pedido">
        &times;
      </button>
      <h2 id="checkout-title">Resumen del pedido</h2>

      <form id="checkout-form">
        <div id="checkout-summary"></div>
        <p id="checkout-error" role="alert" hidden></p>
        <button type="submit" class="checkout-btn">Confirmar pedido</button>
      </form>

      <div id="checkout-confirmation" hidden>
        <p id="checkout-message" role="status"></p>
        <div id="confirmation-summary"></div>
        <button id="checkout-done-btn" type="button" class="checkout-btn">
          Aceptar
        </button>
      </div>
    </dialog>
    <script src="js/main.js" type="module"></script>
  </body>
</html>
